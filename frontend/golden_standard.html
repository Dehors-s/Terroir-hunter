<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天眼寻珍 | Terroir Models - 风土标尺库</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tech-black': '#0f172a',
                        'tech-green': '#10b981',
                        'tech-gold': '#f59e0b',
                        'glass-bg': 'rgba(15, 23, 42, 0.7)',
                        'glass-border': 'rgba(255, 255, 255, 0.1)',
                    },
                    fontFamily: {
                        mono: ['Fira Code', 'monospace'],
                        sans: ['Fira Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --tech-green: #10b981;
            --tech-gold: #f59e0b;
        }
        body {
            background-color: #050511;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0, transparent 50%);
            color: #f0f4f8;
            overflow: hidden;
        }
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        /* Leaflet Dark Mode Override */
        .leaflet-container {
            background: #0f172a !important;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.9);
            color: white;
            border: 1px solid var(--tech-green);
        }
    </style>
</head>
<body class="h-screen w-screen flex relative">

    <!-- 侧边栏导航 -->
    <div class="w-64 h-full p-4 z-20 flex flex-col gap-4">
        <!-- Logo Area -->
        <div class="glass-panel p-4 rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-earth-americas text-tech-gold text-2xl"></i>
            <div>
                <h1 class="font-bold text-sm tracking-widest">TERROIR</h1>
                <h2 class="text-xs text-tech-gold tracking-widest">HUNTER</h2>
            </div>
        </div>

        <!-- Menu -->
        <div class="glass-panel p-4 rounded-2xl flex-1 flex flex-col gap-3">
            <div class="text-xs text-gray-500 uppercase tracking-widest mb-2 px-2">Navigation</div>
            
            <a href="index.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 text-gray-400 hover:text-white transition-all">
                <i class="fa-solid fa-satellite text-lg w-6 text-center"></i>
                <span>主控制台</span>
            </a>
            
            <a href="#" class="flex items-center gap-3 p-3 rounded-xl bg-tech-gold/10 border border-tech-gold/30 text-tech-gold transition-all">
                <i class="fa-solid fa-cube text-lg w-6 text-center"></i>
                <span>风土标尺库</span>
            </a>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="flex-1 flex h-full relative overflow-hidden">
        
        <!-- Left: Map Area (60%) -->
        <div class="w-[60%] h-full relative border-r border-white/10">
            <div id="map" class="w-full h-full z-0"></div>
            
            <!-- Map Overlay Controls -->
            <div class="absolute top-4 left-4 right-4 z-10 flex gap-4 pointer-events-none">
                <div class="glass-panel rounded-xl p-2 flex items-center gap-2 pointer-events-auto flex-1 max-w-md">
                    <i class="fa-solid fa-search text-gray-400 ml-2"></i>
                    <input type="text" id="search-input" placeholder="Search region (e.g. Bordeaux, Napa Valley)..." 
                           class="bg-transparent border-none outline-none text-sm text-white w-full placeholder-gray-500">
                    <button id="search-btn" class="bg-white/10 hover:bg-white/20 text-white rounded-lg px-3 py-1 text-xs transition">
                        LOCATE
                    </button>
                </div>
            </div>

            <!-- Action Button Overlay -->
            <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-10 pointer-events-auto">
                <button id="extract-btn" class="bg-tech-gold hover:bg-yellow-500 text-black font-bold py-3 px-8 rounded-full shadow-[0_0_20px_rgba(245,158,11,0.4)] transition-all flex items-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-dna"></i>
                    <span>提取历史物候特征 (Extract Phenology)</span>
                </button>
            </div>
        </div>

        <!-- Right: Analysis Panel (40%) -->
        <div class="w-[40%] h-full bg-tech-black/80 backdrop-blur-md p-6 flex flex-col overflow-y-auto relative border-l border-white/5">
            
            <!-- Empty State -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 p-10 text-center">
                <div class="w-32 h-32 rounded-full border-2 border-dashed border-gray-700 flex items-center justify-center mb-6">
                    <i class="fa-solid fa-location-dot text-4xl opacity-50"></i>
                </div>
                <h3 class="text-xl font-bold mb-2">等待采样</h3>
                <p class="text-sm">请在地图上选择一个黄金产区坐标，点击“提取”按钮开始分析。</p>
            </div>

            <!-- Analysis Content (Hidden by default) -->
            <div id="analysis-content" class="hidden flex flex-col gap-6 animate-fade-in pb-10">
                <!-- Header -->
                <div class="flex justify-between items-start">
                    <div>
                        <div class="flex items-center gap-2 text-tech-gold text-xs font-mono mb-1">
                            <i class="fa-solid fa-circle-check"></i>
                            <span>ANALYSIS COMPLETE</span>
                        </div>
                        <h2 class="text-2xl font-bold text-white">物候特征模型</h2>
                    </div>
                    <div class="text-right text-xs font-mono text-gray-400">
                        <div id="display-lat">LAT: --.----</div>
                        <div id="display-lon">LON: --.----</div>
                    </div>
                </div>

                <!-- Climate Stats Cards -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-panel p-4 rounded-xl border-l-2 border-tech-gold">
                        <div class="text-gray-400 text-xs mb-1">年均 NDVI 峰值</div>
                        <div class="text-2xl font-bold text-white" id="stat-ndvi">--</div>
                    </div>
                    <div class="glass-panel p-4 rounded-xl border-l-2 border-blue-400">
                        <div class="text-gray-400 text-xs mb-1">生长季均温 (LST)</div>
                        <div class="text-2xl font-bold text-white" id="stat-temp">--°C</div>
                    </div>
                </div>

                <!-- Chart -->
                <div class="glass-panel p-4 rounded-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-bold text-gray-300">标准生长曲线 (Standard Phenology)</h3>
                        <div class="flex gap-2 text-[10px]">
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span>NDVI</span>
                            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-orange-500"></span>LST</span>
                        </div>
                    </div>
                    <div class="h-48 w-full">
                        <canvas id="phenologyChart"></canvas>
                    </div>
                </div>

                <!-- Milestones -->
                <div class="glass-panel p-4 rounded-xl">
                    <h3 class="text-sm font-bold text-gray-300 mb-3">关键物候节点 (Milestones)</h3>
                    <div class="flex justify-between text-xs text-center">
                        <div>
                            <div class="w-8 h-8 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center mx-auto mb-1 border border-green-500/40">
                                <i class="fa-solid fa-seedling"></i>
                            </div>
                            <div class="text-gray-400">发芽期</div>
                            <div class="text-white font-mono" id="milestone-germ">Data Needed</div>
                        </div>
                        <div class="h-px bg-gray-700 w-full mt-4 mx-2"></div>
                        <div>
                            <div class="w-8 h-8 rounded-full bg-tech-gold/20 text-tech-gold flex items-center justify-center mx-auto mb-1 border border-tech-gold/40">
                                <i class="fa-solid fa-wheat-awn"></i>
                            </div>
                            <div class="text-gray-400">成熟期</div>
                            <div class="text-white font-mono" id="milestone-mat">Data Needed</div>
                        </div>
                    </div>
                </div>

                <!-- Save Form -->
                <div class="glass-panel p-5 rounded-xl border border-tech-gold/20 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-b from-tech-gold/5 to-transparent pointer-events-none"></div>
                    
                    <h3 class="text-sm font-bold text-tech-gold mb-4 uppercase tracking-wider">
                        <i class="fa-regular fa-floppy-disk mr-2"></i>保存为金标准
                    </h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">模型名称 (Model Name)</label>
                            <input type="text" id="model-name" placeholder="例如：法国波尔多左岸赤霞珠标准" 
                                   class="w-full bg-black/40 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:border-tech-gold outline-none transition-colors">
                        </div>
                        
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">作物类型 (Crop Type)</label>
                            <select id="crop-type" class="w-full bg-black/40 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white focus:border-tech-gold outline-none">
                                <option value="grape">酿酒葡萄 (Wine Grapes)</option>
                                <option value="apple">高山苹果 (Alpine Apple)</option>
                                <option value="tea">高山茶 (High Mountain Tea)</option>
                                <option value="wheat">小麦 (Wheat)</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">特性标签 (Tags)</label>
                            <div class="flex flex-wrap gap-2" id="tags-container">
                                <!-- Generated by JS -->
                            </div>
                        </div>

                        <button id="save-btn" class="w-full bg-tech-gold hover:bg-yellow-500 text-black font-bold py-3 rounded-lg shadow-lg mt-2 transition flex justify-center items-center gap-2">
                            <span>保存模型到数据库</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="golden_standard.js"></script>
</body>
</html>
